name: Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-24.04 ]
        python-version: [ '3.13' ]
    name: Python ${{ matrix.python-version }} ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Run action
      id: get-version
      uses: ./
      with:
        package_name: pip-versions

    - name: Test action
      env:
        RESULT_VERSION: ${{ steps.get-version.outputs.package_version }}
      run: |
        python -m pip install pip-versions
        EXPECTED=$(python -m pip show pip-versions | grep Version: | cut -f2 -d" ")
        echo "Expected version is: ${EXPECTED}"
        #RESULT_VERSION="${OUTPUT_PACKAGE_VERSION}"
        echo "Result version is: ${RESULT_VERSION}"
        if [ "${RESULT_VERSION}" != "${EXPECTED}" ]
        then
            echo "${RESULT_VERSION}" != "${EXPECTED} !!"
            exit 1
        else
            echo "${RESULT_VERSION}" == "${EXPECTED} !!"
        fi
