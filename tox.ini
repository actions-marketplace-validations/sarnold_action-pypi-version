[tox]
envlist = dev,changes,clean
skip_missing_interpreters = true
isolated_build = true
skipsdist = true

[base]
deps =
    pip>=23.1
    -r requirements.txt

[testenv]
skip_install = true
install_command = pip install {opts} {packages}

[testenv:dev]
envdir = {toxinidir}/.venv

description =
    Create a devel .venv with base deps

passenv =
    DISPLAY
    XAUTHORITY
    HOME
    USERNAME
    USER
    CI
    GITHUB_*
    INPUT_*
    OUTPUT_*
    LANG
    LC_COLLATE
    SSH_*
    GID
    UID
    XDG_*
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE

deps =
    # logging_tree
    {[base]deps}

commands =
    pip-versions latest {posargs:"pip-versions"}

[testenv:check]
skip_install = true

allowlist_externals =
    bash

passenv =
    {[dev]passenv}

setenv =
    CI = {env:CI:false}
    INPUT_PACKAGE_NAME = {env:INPUT_PACKAGE_NAME:pip-versions}

deps =
    {[base]deps}

commands =
    bash entrypoint.sh

[testenv:reuse]
skip_install = true
passenv =
    PYTHON
    CI
    OS
    PYTHONIOENCODING
    PIP_DOWNLOAD_CACHE

deps =
    {[base]deps}
    reuse

commands =
    reuse {posargs:"lint"}

[testenv:changes]
skip_install = true
always_copy = False

allowlist_externals =
    bash

deps =
    {[base]deps}
    gitchangelog @ https://github.com/sarnold/gitchangelog/releases/download/3.2.0/gitchangelog-3.2.0-py3-none-any.whl

commands =
    bash -c 'gitchangelog {posargs} > CHANGELOG.rst'

[testenv:clean]
skip_install = true
allowlist_externals =
    bash

deps =
    pip>=23.1

commands =
    bash -c 'rm -rf dist ext/*/build __pycache__'
